(#vqseam)"/><rect width="420" height="500" fill="url(#vqsh)"/><rect x="1" y="1" width="418" height="498" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/></g><g transform="translate(680 330)"><polygon points="420,0 446,-14 446,486 420,500" fill="#9b6a3a"/><polygon points="0,500 420,500 446,486 26,486" fill="#7d5128"/><polygon points="420,55 446,41 446,45 420,59" fill="#e5cd9d" opacity="0.5"/><polygon points="420,110 446,96 446,100 420,114" fill="#e5cd9d" opacity="0.5"/><polygon points="420,165 446,151 446,155 420,169" fill="#e5cd9d" opacity="0.5"/><polygon points="420,220 446,206 446,210 420,224" fill="#e5cd9d" opacity="0.5"/><polygon points="420,275 446,261 446,265 420,279" fill="#e5cd9d" opacity="0.5"/><polygon points="420,330 446,316 446,320 420,334" fill="#e5cd9d" opacity="0.5"/><polygon points="420,385 446,371 446,375 420,389" fill="#e5cd9d" opacity="0.5"/><polygon points="420,440 446,426 446,430 420,444" fill="#e5cd9d" opacity="0.5"/><polygon points="420,0 446,-14 446,486 420,500" fill="#000" opacity="0.18"/></g>
