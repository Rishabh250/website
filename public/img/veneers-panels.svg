<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0.6" stop-color="#6b4a2c" stop-opacity="0"/><stop offset="1" stop-color="#6b4a2c" stop-opacity="0.16"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
